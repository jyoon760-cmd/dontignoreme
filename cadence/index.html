<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap">
<style>
  /* ---------- Design tokens (see cadence_design.md) ---------- */
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --text:#111111;
    --text-2:#666666;
    --primary:#5B6EF5;
    --accent:#111111;
    --accent-pressed:#333333;
    --on-accent:#FFFFFF;
    --hairline:#EAEAEA;
    /* Wave lines: black through light grey. */
    --wave-1:#111111;
    --wave-2:#555555;
    --wave-3:#999999;
    --wave-4:#CCCCCC;

    /* Serif for headlines, sans for buttons and smaller text. */
    --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
    --font:"Inter",-apple-system,"SF Pro Text",system-ui,sans-serif;
    --ease-out:cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111;
      --surface:#1C1C1C;
      --text:#F5F5F5;
      --text-2:#A3A3A3;
      --primary:#8B98FF;
      --accent:#F5F5F5;
      --accent-pressed:#D9D9D9;
      --on-accent:#111111;
      --hairline:#2A2A2A;
      --wave-1:#F5F5F5;
      --wave-2:#B0B0B0;
      --wave-3:#707070;
      --wave-4:#3D3D3D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111;
    --surface:#1C1C1C;
    --text:#F5F5F5;
    --text-2:#A3A3A3;
    --primary:#8B98FF;
    --accent:#F5F5F5;
    --accent-pressed:#D9D9D9;
    --on-accent:#111111;
    --hairline:#2A2A2A;
    --wave-1:#F5F5F5;
    --wave-2:#B0B0B0;
    --wave-3:#707070;
    --wave-4:#3D3D3D;
  }

  /* ---------- Base ---------- */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  :focus-visible{outline:2px solid var(--text);outline-offset:3px;}

  /* ---------- Landing layout ---------- */
  .landing{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(32px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    max-width:440px;
    margin:0 auto;
    font-family:var(--font-serif);
    font-size:22px;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .brand svg{width:24px;height:24px;color:var(--text);flex:none;}

  /* The wave sits between the brand and the copy, bleeding to the screen edges. */
  .motif{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    margin:32px calc(-1 * max(24px, env(safe-area-inset-left)));
    min-height:180px;
  }
  .motif svg{display:block;width:100%;height:auto;max-height:42vh;}
  .motif path{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .motif path{stroke-width:1.5;}
  .w1{stroke:var(--wave-1);}
  .w2{stroke:var(--wave-2);}
  .w3{stroke:var(--wave-3);}
  .w4{stroke:var(--wave-4);}

  .content{
    width:100%;
    max-width:440px;
    margin:0 auto;
  }
  .mission{
    margin:0 0 48px;
    font-family:var(--font-serif);
    font-size:36px;
    line-height:1.12;
    font-weight:400;
    letter-spacing:-0.015em;
    text-wrap:balance;
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:56px;
    padding:0 24px;
    border:0;
    border-radius:20px;
    background:var(--accent);
    color:var(--on-accent);
    font:inherit;
    font-size:16px;
    font-weight:600;
    letter-spacing:-0.005em;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background-color 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  .cta:hover{background:var(--accent-pressed);}
  .cta:active{transform:scale(.985);}

  .signin{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:44px;
    margin-top:12px;
    color:var(--text-2);
    font-size:15px;
    font-weight:500;
    text-decoration:none;
    border-radius:12px;
  }
  .signin span{color:var(--text);}
  .signin:hover span{text-decoration:underline;text-underline-offset:3px;}

  /* ---------- Motion: gentle fade + 8px rise, staggered 40ms ---------- */
  .reveal{
    opacity:0;
    transform:translateY(8px);
    animation:rise 250ms var(--ease-out) forwards;
    animation-delay:calc(var(--i, 0) * 40ms + 60ms);
  }
  @keyframes rise{to{opacity:1;transform:none;}}

  /* All four lines draw in together, once, then hold still. */
  .motif .reveal-mask{
    transform-box:fill-box;
    transform-origin:left center;
    transform:scaleX(0);
    animation:draw 1400ms var(--ease-out) 120ms forwards;
  }
  @keyframes draw{to{transform:scaleX(1);}}

  @media (prefers-reduced-motion: reduce){
    .reveal,.motif .reveal-mask{animation:none;opacity:1;transform:none;}
  }

  /* Larger screens: same composition, just more air. */
  @media (min-width:768px){
    .mission{font-size:42px;margin-bottom:40px;}
    .motif svg{max-height:34vh;}
  }
</style>
</head>
